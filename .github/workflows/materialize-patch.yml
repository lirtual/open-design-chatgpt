name: Materialize integration patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode, verify, and commit patch
        shell: bash
        run: |
          set -euo pipefail
          encoded='patches/open-design-chatgpt-v0.1.patch.xz.b64'
          patch='patches/open-design-chatgpt-v0.1.patch'
          if [[ ! -f "$encoded" ]]; then
            echo 'Patch is already materialized; nothing to do.'
            exit 0
          fi

          base64 --decode "$encoded" | xz --decompress > "$patch"
          echo '7582df36713bbc2a1c1d0e19141d8550e8f5835f8b1490c9a61c4ca1d6e9de8f  patches/open-design-chatgpt-v0.1.patch' | sha256sum --check --strict -

          git config user.name 'open-design-chatgpt-ci'
          git config user.email 'open-design-chatgpt-ci@users.noreply.github.com'
          git add "$patch"
          git rm "$encoded"
          git commit -m 'chore: materialize integration patch'
          git push origin HEAD:main
