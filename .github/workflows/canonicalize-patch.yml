name: Canonicalize integration patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned OpenDesign upstream
        uses: actions/checkout@v4
        with:
          repository: nexu-io/open-design
          ref: eca7c7ab989852fb586384e19bcb6a6f2d7321f4
          path: upstream

      - name: Apply hunks by exact old text and regenerate canonical Git diff
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$GITHUB_WORKSPACE/patches/open-design-chatgpt-v0.1.patch"
          canonical="$RUNNER_TEMP/open-design-chatgpt-v0.1.patch"

          PATCH_FILE="$patch_file" UPSTREAM="$GITHUB_WORKSPACE/upstream" python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from dataclasses import dataclass
          from pathlib import Path

          patch_path = Path(os.environ['PATCH_FILE'])
          upstream = Path(os.environ['UPSTREAM'])
          lines = patch_path.read_text(encoding='utf-8').splitlines(keepends=True)

          @dataclass
          class Hunk:
              old_start: int
              old_lines: list[str]
              new_lines: list[str]

          @dataclass
          class FilePatch:
              old_path: str
              new_path: str
              hunks: list[Hunk]

          file_patches: list[FilePatch] = []
          i = 0
          hunk_header = re.compile(r'^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@')
          while i < len(lines):
              if not lines[i].startswith('diff --git '):
                  i += 1
                  continue
              i += 1
              old_path = new_path = None
              hunks: list[Hunk] = []
              while i < len(lines) and not lines[i].startswith('diff --git '):
                  line = lines[i]
                  if line.startswith('--- '):
                      old_path = line[4:].strip()
                      i += 1
                      continue
                  if line.startswith('+++ '):
                      new_path = line[4:].strip()
                      i += 1
                      continue
                  if line.startswith('@@ '):
                      match = hunk_header.match(line)
                      if not match:
                          raise SystemExit(f'unsupported hunk header: {line.rstrip()}')
                      old_start = int(match.group(1))
                      i += 1
                      old_lines: list[str] = []
                      new_lines: list[str] = []
                      while i < len(lines) and not lines[i].startswith('@@ ') and not lines[i].startswith('diff --git '):
                          body = lines[i]
                          if body.startswith('\\ No newline at end of file'):
                              i += 1
                              continue
                          if body.startswith(' '):
                              old_lines.append(body[1:])
                              new_lines.append(body[1:])
                          elif body.startswith('-'):
                              old_lines.append(body[1:])
                          elif body.startswith('+'):
                              new_lines.append(body[1:])
                          else:
                              break
                          i += 1
                      hunks.append(Hunk(old_start, old_lines, new_lines))
                      continue
                  i += 1
              if old_path is None or new_path is None:
                  raise SystemExit('file patch missing ---/+++ path')
              file_patches.append(FilePatch(old_path, new_path, hunks))

          def repo_path(value: str) -> Path:
              if value == '/dev/null':
                  raise ValueError('/dev/null has no repository path')
              if value.startswith('a/') or value.startswith('b/'):
                  value = value[2:]
              return upstream / value

          for file_patch in file_patches:
              if file_patch.old_path == '/dev/null':
                  target = repo_path(file_patch.new_path)
                  if target.exists():
                      raise SystemExit(f'new-file target already exists: {target.relative_to(upstream)}')
                  content: list[str] = []
                  for hunk in file_patch.hunks:
                      if hunk.old_lines:
                          raise SystemExit(f'new-file hunk unexpectedly has old text: {target.relative_to(upstream)}')
                      content.extend(hunk.new_lines)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(''.join(content), encoding='utf-8')
                  print(f'created {target.relative_to(upstream)}')
                  continue

              if file_patch.new_path == '/dev/null':
                  raise SystemExit('delete-file patches are not expected in this integration')

              target = repo_path(file_patch.old_path)
              original = target.read_text(encoding='utf-8').splitlines(keepends=True)
              resolved: list[tuple[int, Hunk]] = []
              for hunk in file_patch.hunks:
                  old = hunk.old_lines
                  if not old:
                      raise SystemExit(f'zero-old-line hunk in existing file: {target.relative_to(upstream)}')
                  candidates = [
                      pos
                      for pos in range(0, len(original) - len(old) + 1)
                      if original[pos:pos + len(old)] == old
                  ]
                  if not candidates:
                      raise SystemExit(
                          f'old text not found exactly in {target.relative_to(upstream)} near declared line {hunk.old_start}'
                      )
                  if len(candidates) > 1:
                      declared = max(0, hunk.old_start - 1)
                      ranked = sorted(candidates, key=lambda pos: (abs(pos - declared), pos))
                      if len(ranked) > 1 and abs(ranked[0] - declared) == abs(ranked[1] - declared):
                          raise SystemExit(
                              f'ambiguous exact hunk in {target.relative_to(upstream)}: candidates {[p + 1 for p in candidates]}'
                          )
                      chosen = ranked[0]
                  else:
                      chosen = candidates[0]
                  resolved.append((chosen, hunk))

              ordered = sorted(resolved, key=lambda item: item[0])
              for (left_pos, left), (right_pos, _right) in zip(ordered, ordered[1:]):
                  if left_pos + len(left.old_lines) > right_pos:
                      raise SystemExit(
                          f'overlapping hunks in {target.relative_to(upstream)} at lines {left_pos + 1} and {right_pos + 1}'
                      )

              updated = original[:]
              for pos, hunk in sorted(resolved, key=lambda item: item[0], reverse=True):
                  updated[pos:pos + len(hunk.old_lines)] = hunk.new_lines
              target.write_text(''.join(updated), encoding='utf-8')
              print(f'updated {target.relative_to(upstream)} ({len(resolved)} hunks)')
          PY

          git -C upstream add -N \
            apps/daemon/tests/mcp-chatgpt-profile.test.ts \
            apps/daemon/tests/projects-atomic-write.test.ts \
            apps/daemon/tests/project-file-preconditions.test.ts
          git -C upstream diff --binary > "$canonical"
          test -s "$canonical"

          git -C upstream reset --hard HEAD
          git -C upstream clean -fd
          git -C upstream apply --check "$canonical"

          if cmp -s "$canonical" "$patch_file"; then
            echo 'Patch is already canonical.'
            exit 0
          fi

          cp "$canonical" "$patch_file"
          git config user.name 'open-design-chatgpt-ci'
          git config user.email 'open-design-chatgpt-ci@users.noreply.github.com'
          git add patches/open-design-chatgpt-v0.1.patch
          git commit -m 'fix: canonicalize patch against pinned upstream'
          git push origin HEAD:main
